<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFF0F5"/>
        <stop offset="100%" stop-color="#FFE4E1"/>
      </linearGradient>
      <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FFB6C1" flood-opacity="0.3"/>
      </filter>
    </defs>
    <!-- Background Circle -->
    <circle cx="250" cy="250" r="235" fill="url(#bgGrad)" stroke="#FFB6C1" stroke-width="4"/>
    
    <!-- Cat Ears -->
    <polygon points="150,160 120,60 210,130" fill="#FFFFFF" stroke="#333333" stroke-width="8" stroke-linejoin="round"/>
    <polygon points="155,145 135,80 195,125" fill="#FFB6C1"/>
    
    <polygon points="350,160 380,60 290,130" fill="#FFFFFF" stroke="#333333" stroke-width="8" stroke-linejoin="round"/>
    <polygon points="345,145 365,80 305,125" fill="#FFB6C1"/>

    <!-- Cat Body -->
    <ellipse cx="250" cy="340" rx="140" ry="120" fill="#FFFFFF" stroke="#333333" stroke-width="8" filter="url(#softShadow)"/>
    
    <!-- Tail -->
    <path d="M 370 360 Q 440 340 430 270 Q 420 240 395 260 Q 405 310 350 340 Z" fill="#FFA07A" stroke="#333333" stroke-width="6"/>

    <!-- Cat Head -->
    <circle cx="250" cy="200" r="115" fill="#FFFFFF" stroke="#333333" stroke-width="8"/>

    <!-- Calico Spots on Head -->
    <path d="M 160 130 Q 180 190 220 160 Q 200 110 160 130 Z" fill="#FFA07A"/>
    <path d="M 340 130 Q 320 190 280 160 Q 300 110 340 130 Z" fill="#A0A0A0"/>

    <!-- Big Webtoon Eyes -->
    <ellipse cx="195" cy="195" rx="20" ry="26" fill="#1A1A1A"/>
    <circle cx="188" cy="185" r="8" fill="#FFFFFF"/>
    <circle cx="204" cy="206" r="4" fill="#FFFFFF"/>

    <ellipse cx="305" cy="195" rx="20" ry="26" fill="#1A1A1A"/>
    <circle cx="298" cy="185" r="8" fill="#FFFFFF"/>
    <circle cx="314" cy="206" r="4" fill="#FFFFFF"/>

    <!-- Cute Blush -->
    <ellipse cx="165" cy="225" rx="16" ry="10" fill="#FF85A2" opacity="0.6"/>
    <ellipse cx="335" cy="225" rx="16" ry="10" fill="#FF85A2" opacity="0.6"/>

    <!-- Nose & Mouth -->
    <polygon points="250,215 242,207 258,207" fill="#FF85A2"/>
    <path d="M 250 215 Q 235 230 220 222" fill="none" stroke="#333333" stroke-width="5" stroke-linecap="round"/>
    <path d="M 250 215 Q 265 230 280 222" fill="none" stroke="#333333" stroke-width="5" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="140" y1="210" x2="80" y2="200" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
    <line x1="140" y1="225" x2="75" y2="230" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
    <line x1="360" y1="210" x2="420" y2="200" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
    <line x1="360" y1="225" x2="425" y2="230" stroke="#333333" stroke-width="4" stroke-linecap="round"/>

    <!-- Cute Running Ribbon & Golden Bell Collar -->
    <path d="M 170 290 Q 250 330 330 290" fill="none" stroke="#00C73C" stroke-width="18" stroke-linecap="round"/>
    <circle cx="250" cy="320" r="18" fill="#FFD700" stroke="#333333" stroke-width="4"/>
    <circle cx="250" cy="320" r="4" fill="#B8860B"/>

    <!-- Paws with Pink Jelly -->
    <ellipse cx="205" cy="400" rx="30" ry="24" fill="#FFFFFF" stroke="#333333" stroke-width="6"/>
    <ellipse cx="295" cy="400" rx="30" ry="24" fill="#FFFFFF" stroke="#333333" stroke-width="6"/>
    <circle cx="205" cy="400" r="10" fill="#FF85A2"/>
    <circle cx="295" cy="400" r="10" fill="#FF85A2"/>
  </svg>