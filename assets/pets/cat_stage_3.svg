<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
      <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E1F5FE"/>
        <stop offset="100%" stop-color="#B3E5FC"/>
      </linearGradient>
    </defs>
    <circle cx="250" cy="250" r="235" fill="url(#bgGrad3)" stroke="#4FC3F7" stroke-width="4"/>
    
    <!-- Headphones -->
    <path d="M 150 150 Q 250 80 350 150" fill="none" stroke="#FF4081" stroke-width="16" stroke-linecap="round"/>
    <rect x="130" y="140" width="30" height="60" rx="12" fill="#FF4081" stroke="#333" stroke-width="5"/>
    <rect x="340" y="140" width="30" height="60" rx="12" fill="#FF4081" stroke="#333" stroke-width="5"/>

    <!-- Ears -->
    <polygon points="170,140 135,60 215,115" fill="#FFFFFF" stroke="#333333" stroke-width="7"/>
    <polygon points="330,140 365,60 285,115" fill="#FFFFFF" stroke="#333333" stroke-width="7"/>

    <!-- Head & Body -->
    <ellipse cx="250" cy="330" rx="120" ry="100" fill="#FFFFFF" stroke="#333333" stroke-width="8"/>
    <circle cx="250" cy="190" r="105" fill="#FFFFFF" stroke="#333333" stroke-width="8"/>

    <!-- Sunglasses / Cool Eyes -->
    <rect x="180" y="165" width="55" height="40" rx="14" fill="#333333"/>
    <rect x="265" y="165" width="55" height="40" rx="14" fill="#333333"/>
    <line x1="235" y1="180" x2="265" y2="180" stroke="#333" stroke-width="6"/>
    <!-- Sunglasses Glare -->
    <line x1="190" y1="175" x2="220" y2="195" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="275" y1="175" x2="305" y2="195" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

    <!-- Confident Smile -->
    <path d="M 235 225 Q 250 240 270 220" fill="none" stroke="#333333" stroke-width="6" stroke-linecap="round"/>

    <!-- Sporty Vest -->
    <path d="M 190 280 L 310 280 L 320 370 L 180 370 Z" fill="#00C73C" stroke="#333333" stroke-width="6"/>
    <text x="250" y="335" font-family="sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle">RUN</text>
  </svg>